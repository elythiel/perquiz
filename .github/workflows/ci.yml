# Verifies every pull request, and does nothing else.
#
# The name of this file and the name of the job below are BOTH load-bearing, in
# a way nothing here can check: branch protection on `main` matches its required
# check by name, so renaming either would make the requirement unsatisfiable and
# block every merge, permanently and silently. That setting lives on GitHub and
# is invisible from the repository — if this ever has to be renamed, the
# protection rule has to be edited in the same breath.
#
# `pull_request` and nothing else, where this file once also ran on pushes to
# `main`. A pull request's checks run on the merge ref — exactly the content
# that lands — and `main` cannot be reached any other way, so a second run after
# the merge would verify a commit that was already verified. Publication moved
# out with the push trigger, to `release.yml`; the split is what let it go.
#
# Unfiltered on purpose: a pull request stacked on another branch is exactly the
# case that had no CI at all (vikunja-89, measured on Dependabot's first pull
# request — six major action bumps, zero check runs), and narrowing this to
# `branches: [main]` would leave it there.
name: ci

on:
  pull_request:

# Least privilege at the root, so a job that says nothing gets nothing. Nothing
# in this file needs more: `check` reads the code and runs the test suite.
permissions:
  contents: read

# A branch that gets a second push supersedes its own run: the older answer is
# about code nobody is proposing any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Do not rename. See the note at the top of this file.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # No setup-node cache: its cache probe runs before we can enable
      # corepack, and the install is under a minute anyway.
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
