# Publishes a container image once per version, and tags the commit it came from.
#
# Nothing here knows where Perquiz runs — no host, no domain, no reverse-proxy
# config, no secret beyond the token GitHub hands the job itself. Publication
# produces an immutable, addressable artefact and stops there. The deployment
# pulls; see the "Publishing" section of the README.
#
# It VERIFIES NOTHING, and that is the deliberate half. `main` is protected — a
# pull request is required, `check` from `ci.yml` is a required check, direct
# pushes are refused — and a pull request's checks run on the merge ref, which
# is exactly the content that lands. The code this workflow builds has therefore
# already been checked, and a `needs: check` here would be a belt over braces.
#
# What that trades away, stated because it cannot be guarded from inside the
# repository: an admin bypass, or branch protection relaxed one day, and this
# workflow would publish unverified code. It is a SETTINGS risk — invisible from
# here, so no test can catch it. The alternative was a second copy of
# lint/typecheck/test in this file, which doubles the minutes on every merge and
# leaves two lists to keep in step; the protection is the thing to keep, not the
# duplicate. If that protection is ever removed, this file is the one to revisit.
#
# The trigger is the other half of the same guarantee: `push` to `main` and a
# manual dispatch, and nothing else. A pull request CANNOT reach the registry
# because there is no event here that a pull request raises — an impossibility
# rather than a condition, which is what replaced the `github.event_name`
# guard this file was carrying. Adding `pull_request:` below would publish an
# image and push a tag for code that has not landed, and here a tag is the
# promise that an image exists at a reviewed commit.
#
# No `tags: ['v*']` trigger either: this workflow CREATES the tags. Listening
# for them too would be dead configuration, and a tag pushed by hand would walk
# straight past the "already published" guard below with code nobody checked.
name: release

on:
  push:
    branches: [main]
  # The way out when a release has to happen without a merge to make it.
  workflow_dispatch:

# Least privilege at the root, so a job that says nothing gets nothing.
#
# Without this, `version` inherits whatever the repository's default happens to
# be — and on a public repository that default is a setting somebody else can
# change, in a place nobody looks. `publish` keeps its own block, which REPLACES
# this one rather than adding to it: it needs `contents: write` to push the tag
# and `packages: write` to push the image.
permissions:
  contents: read

# Two pushes in a row must not race to publish the same version.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate is the version, and moving it is a deliberate line in a commit.
  # Everything reaching `main` is checked; only a new version is published, so
  # what a deployment pulls is what somebody decided to release rather than
  # whatever landed last.
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.read.outputs.value }}
      unpublished: ${{ steps.read.outputs.unpublished }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tags ARE the question being asked, and a shallow clone has
          # none: without this the guard always answers "never published" and
          # every push republishes — the exact opposite of the point.
          fetch-depth: 0

      - id: read
        run: |
          value="$(node -p "require('./package.json').version")"
          echo "value=$value" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$value" > /dev/null; then
            echo "unpublished=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$value is already published; nothing to do."
          else
            echo "unpublished=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: [version]
    if: needs.version.outputs.unpublished == 'true'
    runs-on: ubuntu-latest
    permissions:
      # `write`, unlike the root block: this job pushes the tag it just
      # published.
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `github.repository` rather than a literal: renaming the repo or forking
      # it needs no edit here.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # One tag, and it is the version. A moving tag has nothing left to
          # do here: the deployment pins a version and Renovate bumps it, which
          # is something it can only do with semver. `sha-<short>` is gone too
          # — the commit is already in the image, as
          # `org.opencontainers.image.revision` (the `labels:` below), so
          # `docker inspect` answers "what is running" without a tag for it.
          tags: type=raw,value=v${{ needs.version.outputs.value }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # amd64 only. Adding linux/arm64 here works, but sharp and
          # better-sqlite3 compile under QEMU and the build goes from minutes
          # to tens of minutes — worth it only once something actually runs on
          # arm.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Last, and only on success: a tag is a promise that an image exists. A
      # failed build leaves none, and the next push tries the same version
      # again rather than skipping it as already released.
      #
      # Annotated, and told who it is by: an annotated tag carries a date and
      # an author, which is what a release marker is for, and stating the
      # identity keeps this independent of whatever git config a runner
      # happens to ship with.
      - name: Tag the commit this version was built from
        env:
          VERSION: v${{ needs.version.outputs.value }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"
