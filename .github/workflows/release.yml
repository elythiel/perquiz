# Publishes a container image. That is the whole job of this file: it produces
# an immutable, addressable artefact and stops there. Nothing here knows where
# Perquiz runs — no host, no domain, no reverse-proxy config, no secret beyond
# the token GitHub hands the job itself. The deployment pulls; see the
# "Publishing" section of the README.
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Two pushes in a row must not race for the moving tags.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # An auto-deploy without a gate is the thing that breaks the party: whatever
  # lands on main is what a deployment pulls minutes later.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # No setup-node cache: its cache probe runs before we can enable
      # corepack, and the install is under a minute anyway.
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `github.repository` rather than a literal: renaming the repo or forking
      # it needs no edit here.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Two kinds of tag on purpose: `sha-<short>` is immutable and is what
          # a deployment pins and rolls back to; `main` / `latest` / `vX.Y.Z`
          # move, and are what an auto-updater watches.
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # amd64 only. Adding linux/arm64 here works, but sharp and
          # better-sqlite3 compile under QEMU and the build goes from minutes
          # to tens of minutes — worth it only once something actually runs on
          # arm.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
