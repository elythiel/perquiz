# A portable starting point, not the deployment. Everything specific to where
# Perquiz actually runs — reverse-proxy labels, hostname, TLS, external
# networks, backup jobs — belongs in your own infrastructure config, which is
# why none of it is here. HTTPS termination is assumed to be the host's job
# (SPEC.md §10).
#
# The app already sends `Strict-Transport-Security: max-age=31536000;
# includeSubDomains` on every response, so a proxy that passes headers through
# needs nothing added. Two things worth knowing: serve this over HTTPS only —
# a browser ignores the header in the clear, so plain HTTP is not "the header
# not working", it is the header never arriving — and if you want the
# `preload` list, add it at your proxy rather than here. That submission is
# effectively irreversible and commits every subdomain of your host, which is
# not a promise an example file gets to make for you.
#
#   cp compose.example.yml compose.yml   # then edit
#   cp .env.example .env                 # then fill it in
#   docker compose up -d

services:
  perquiz:
    # Always a version, because that is the only kind of tag published: it
    # never moves, so this line says exactly what is running, and rolling back
    # is the previous version of this file. A bot that watches semver — Renovate
    # and friends — bumps it for you.
    image: ghcr.io/elythiel/perquiz:v0.4.0
    restart: unless-stopped
    env_file: .env
    ports:
      # Bind to the loopback (127.0.0.1:3000:3000) if a reverse proxy on the
      # same host is the only thing that should reach it.
      - "3000:3000"
    volumes:
      # All persistent state: app.db + photos/. The only thing to back up.
      - perquiz-data:/app/data

volumes:
  perquiz-data:
